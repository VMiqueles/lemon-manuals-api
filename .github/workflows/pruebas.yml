name: Pruebas Python
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_main.py -v
